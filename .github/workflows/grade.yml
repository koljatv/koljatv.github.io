name: grade

# Every 20 minutes: check the copies of what airs soon, route round dead links, rebuild the schedule,
# commit grade/schedule2.json (with commercial breaks) and grade/schedule.json (without, for Retrotv 0.3.0) when they changed, and publish public/ (the site + grade/schedule.json + grade/now.json)
# on GitHub Pages. Our idents and trailers are Release assets (tag ours-v1), not part of the site. The weather forecast
# (public/tempo/previsao.json and its segment's video) is made in this job and published with the site, not committed.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  push:
    branches: [main]
    paths: ["catalog/**", "tools/**", "public/index.html", "public/ao-vivo/**", "public/tv/**", "public/legendas/**", ".github/workflows/grade.yml"]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Link health is kept between runs in the Actions cache, not in git (it changes every run).
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: health-${{ github.run_id }}
          restore-keys: health-

      # PREVISÃO DO TEMPO: the forecast (Open-Meteo, no key) every few hours and shortly before each airing, and the
      # segment's video made from it (tools/tempo.py, tools/tempo_video.py). Kept in state/ (the cache), not in git.
      # If this fails, the schedule leaves the forecast out once it is 12 h old (the station card airs instead).
      - name: Weather forecast
        continue-on-error: true
        run: |
          if [ "$(python3 tools/tempo.py due)" = yes ]; then
            python3 tools/tempo.py fetch
            command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null; }
            python3 -m pip install -q pillow
            python3 tools/tempo_video.py
          fi

      - name: Check links and build
        run: |
          python3 tools/build.py          # make sure the schedule reaches today before checking it
          python3 tools/check.py --hours 8 --extra 60
          python3 tools/build.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: health-${{ github.run_id }}

      - name: Commit the schedule when it changed
        run: |
          git config user.name "koljatv-grade bot"
          git config user.email "koljatv-grade@users.noreply.github.com"
          git add public/grade/schedule.json public/grade/schedule2.json
          if ! git diff --cached --quiet; then
            git commit -m "grade: $(python3 -c 'import json;print(json.load(open("public/grade/schedule2.json"))["rev"])')"
            git push
          fi

      # The site's own player (/ and /ao-vivo) plays our idents and breaks from the site itself: a copy of each
      # Release asset goes into the published site (not into git). If one can't be fetched, the player uses the Release.
      - name: Our pieces for the site's player
        run: |
          mkdir -p public/tv/ours
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          ours = json.load(open("public/grade/schedule2.json"))["ours"]
          for k, o in ours.items():
              if o.get("kind") == "tempo": continue  # the weather forecast is made here (tools/tempo.py publish)
              try:
                  data = urllib.request.urlopen(o["url"], timeout=60).read()
              except Exception as e:
                  print("skip", k, e)
                  continue
              if o.get("sha256") and hashlib.sha256(data).hexdigest() != o["sha256"]:
                  raise ValueError("Own piece media hash mismatch: " + k)
              pathlib.Path(f"public/tv/ours/{k}.mp4").write_bytes(data)
          # Own shorts remain ordinary catalogue titles, with a Pages copy and Release fallback.
          for t in json.load(open("catalog/titles.json")):
              if not t.get("site_file"): continue
              name = t["site_file"]
              if pathlib.Path(name).name != name: raise ValueError("Invalid site_file")
              url = next(s["url"] for s in t["sources"] if s["url"].startswith("https://github.com/koljatv/koljatv.github.io/releases/download/"))
              data = urllib.request.urlopen(url, timeout=60).read()
              if hashlib.sha256(data).hexdigest() != t["sha256"]: raise ValueError("Short media hash mismatch")
              pathlib.Path("public/tv/ours", name).write_bytes(data)
          PY
          python3 tools/tempo.py publish
          du -sh public/tv/ours

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
